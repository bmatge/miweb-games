server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Un dossier par jeu : /snake/ sert /snake/index.html. Un chemin inconnu
    # rend un 404 franc plutot que de rediriger vers l'accueil, pour qu'un
    # lien casse se voie.
    location / {
        try_files $uri $uri/ =404;
    }

    # Tableau des scores partage : relaye vers le service `api` du compose.
    # Jamais en cache, et l'adresse transmise ne sert qu'a freiner le debit.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
        add_header Cache-Control "no-store";
    }

    # Le type du manifeste n'est pas dans les mime.types de cette image :
    # sans lui, Safari ignore le mode web app.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
    }

    # Le lab n'a pas vocation a etre indexe (ADR-042).
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Pas de cache ferme sur le socle partage : un `max-age` d'une heure a
    # servi l'ancien arcade.js pendant que le HTML, lui, etait deja a jour —
    # les jeux tournaient avec un socle perime. `no-cache` autorise toujours
    # les 304 via ETag, le cout reseau reste nul et le contenu est juste.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
